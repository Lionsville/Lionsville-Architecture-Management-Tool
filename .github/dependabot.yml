# A pinned action is a frozen action; this is what thaws it on purpose.
#
# **Majors too, one pull request each.** A major is read on its merits — its
# licence (it must stay one an AGPL application can ship), its changelog and
# breaking changes, its peer ranges — and taken when nothing stands in the
# way, with the migration in the same commit. One with a real blocker (a peer
# range that does not accept it yet, a tool that breaks on it) is closed with
# the blocker named. The same holds for a 0.x package's minor, which is how
# 0.x says "breaking" (the layout engines and the archive library), and for
# TypeScript's minor, which `package.json` pins with a tilde so that it
# arrives as a pull request of its own.
#
# **Monthly, at most two open**: a month's minors and patches are one grouped
# pull request per ecosystem, read once; a major is its own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: [typescript, elkjs, libavoid-js, fflate]
