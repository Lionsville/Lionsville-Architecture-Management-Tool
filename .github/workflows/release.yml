# Cut a release on GitHub; get the web build, its bill of materials and their
# sums on the release page, and the web build on app.architecture.lionsville.nl.
#
# The trigger is a *published* release, not a pushed tag. The release is the
# thing a human makes — with its notes, its tag and its title — and this
# workflow fills it in.
#
# No installers (ADR-0030). The desktop app is built, signed and published
# where it is downloaded from, and anyone may build their own from this
# source (`electron-builder.cjs`, `docs/release.md`). So nothing here signs,
# notarizes or holds a secret: the deployment signs in by OIDC, and the five
# values it reads are variables, listed in docs/release.md.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

env:
  NODE_VERSION: '26'

jobs:
  # The version is settled once, here, and the tag's commit is held to the
  # trunk gate before anything is built.
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # To read check-runs of the commit the tag names.
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag is the version
        id: version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -n "${TAG:-}" ]; then
            case "$TAG" in
              v*) version="${TAG#v}" ;;
              *)  echo "::error::Release tag '$TAG' must be of the form v1.2.3." >&2; exit 1 ;;
            esac
          else
            # A manual run has no tag. Build whatever package.json says; it is
            # never published, so the number only has to be valid.
            version="$(node -p 'require("./package.json").version')"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a semantic version." >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      # The trunk gate is what makes a release trustworthy, so a release may
      # not step around it: the commit the tag names must already carry a
      # green `check` run from check.yml.
      - name: The tag's commit has a green check
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          green="$(gh api \
            "repos/$REPOSITORY/commits/$COMMIT/check-runs?check_name=check&status=completed" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
          if [ "$green" -eq 0 ]; then
            echo "::error::$TAG names $COMMIT, which has no successful 'check' run. A release is built from a commit the trunk gate has already passed: push the commit, let Check go green, then publish the release." >&2
            exit 1
          fi
          echo "$COMMIT has a green check."

  # Nothing is published on a red suite. This is the same `check:all` a human
  # runs before handing work back: typecheck, lint, every test and a
  # production web build.
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check:all

  # The app, for a browser. `npm run build` is the web build the README's
  # "Running from source" section serves on :5200; here it is zipped as
  # `web-<version>.zip` and put on the release with the bill of materials, the
  # sums over both and an attestation of where they came from. It is built on
  # the tag and stamped with its version, after `verify`; a manual run keeps
  # it all as a run artifact and uploads nothing.
  web:
    name: Build web
    needs: [preflight, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # The provenance attestation below: a token from the runner's OIDC
      # issuer to sign with, and somewhere in this repository to keep it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # The tag is the single source of truth for the version. package.json
      # carries 0.0.0 in the repository so nobody has to remember to bump it,
      # and nobody can bump it to something the tag disagrees with.
      - name: Stamp the version
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: npm version --no-git-tag-version --allow-same-version "$VERSION"
      - run: npm run build
      - name: What this build is
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          jq -cn --arg version "$VERSION" --arg commit "$GITHUB_SHA" \
            '{version: $version, commit: $commit, built: (now | todate)}' > dist/version.json
      - name: Zip it
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: (cd dist && zip -qr "../web-$VERSION.zip" .)
      # The bill of materials, in CycloneDX: what the web build and the
      # desktop main process are made of, for this release and for any build
      # made from its source. Not `npm sbom --omit dev` as it stands —
      # everything bundled is a dev dependency, so that document is empty;
      # `build/sbom.ts` says how it narrows npm's own to what ships.
      - name: The bill of materials
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: node build/sbom.ts "sbom-$VERSION.cdx.json" .=src,electron
      # A download nobody can check is a download nobody should use. One
      # `.sha256` per file, in sha256sum's own format so `sha256sum -c` reads
      # it, naming the file alone so it reads from the folder the download
      # landed in — and SHA256SUMS over both, the one file to check against.
      - name: A checksum per file, and one file of them
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          for file in "web-$VERSION.zip" "sbom-$VERSION.cdx.json"; do
            sha256sum "$file" > "$file.sha256"
          done
          # Sorted, so the same release always produces the same file.
          cat -- "sbom-$VERSION.cdx.json.sha256" "web-$VERSION.zip.sha256" > SHA256SUMS
          cat SHA256SUMS
      # Where the files came from, signed by GitHub for this repository, this
      # workflow and this commit, so a download can be checked against more
      # than a checksum the same release carries: `gh attestation verify
      # <file> --repo Lionsville/Lionsville-Architecture-Management-Tool`.
      # Public repositories keep attestations on any plan. Made on a manual
      # run too, since its files are downloadable from the run.
      - name: Attest where they came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS
      - name: Put it on the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          gh release upload "$TAG" "web-$VERSION.zip" "web-$VERSION.zip.sha256" \
            "sbom-$VERSION.cdx.json" "sbom-$VERSION.cdx.json.sha256" SHA256SUMS --clobber
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-${{ needs.preflight.outputs.version }}
          path: |
            web-${{ needs.preflight.outputs.version }}.zip
            web-${{ needs.preflight.outputs.version }}.zip.sha256
            sbom-${{ needs.preflight.outputs.version }}.cdx.json
            sbom-${{ needs.preflight.outputs.version }}.cdx.json.sha256
            SHA256SUMS
          retention-days: 14

  # app.architecture.lionsville.nl runs the newest stable release, and this is
  # where it gets it: the web build above, deployed once the release is whole —
  # the zip, its sums and the bill of materials on the release page. Never for
  # a beta. The host is a Static Web App; the workflow signs in by OIDC under
  # the `app` environment with an identity that can read that one resource's
  # deployment token and nothing else, and the token is fetched for the run
  # and never stored. The five `WEB_HOST_*` values are variables, not
  # secrets — docs/release.md lists them.
  web-host:
    name: Point app.architecture.lionsville.nl at this release
    needs: [preflight, web]
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment:
      name: app
      url: https://app.architecture.lionsville.nl/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/staticwebapp.config.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-${{ needs.preflight.outputs.version }}
      - name: Unpack it, with how the host serves it
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir app && unzip -q "web-$VERSION.zip" -d app
          cp .github/staticwebapp.config.json app/
          test -f app/index.html && test -f app/version.json
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.WEB_HOST_CLIENT_ID }}
          tenant-id: ${{ vars.WEB_HOST_TENANT_ID }}
          subscription-id: ${{ vars.WEB_HOST_SUBSCRIPTION_ID }}
      - name: The deployment token, for this run only
        id: token
        shell: bash
        env:
          STATIC_SITE: ${{ vars.WEB_HOST_STATIC_SITE }}
          RESOURCE_GROUP: ${{ vars.WEB_HOST_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          token="$(az staticwebapp secrets list \
            --name "$STATIC_SITE" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.apiKey -o tsv)"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: app
          skip_app_build: true
          skip_api_build: true
      - name: It answers, with this version
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -uo pipefail
          said=''
          for attempt in $(seq 1 30); do
            said="$(curl -fsS --max-time 10 https://app.architecture.lionsville.nl/version.json || true)"
            case "$said" in
              *"\"version\":\"$VERSION\""*) echo "$said"; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::app.architecture.lionsville.nl is not running $VERSION: $said"
          exit 1
