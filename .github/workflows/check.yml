# The fast loop, run again where anybody can see it.
#
# This decides nothing the local loop had not already decided: `npm run check`
# before a commit is still the gate. What this buys is the evidence — a check
# per commit that a second maintainer, a reviewer or an auditor can click,
# rather than a tree that is green on the author's word. It is kept cheap:
# a burst of commits costs one run, and a change to prose costs none.

name: Check

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '26'

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
