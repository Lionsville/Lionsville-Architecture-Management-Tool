name: Feature request
description: Something the tool should do and does not.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For anything bigger than a small addition, a discussion first is the better place: `CONTRIBUTING.md` says why.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and where the tool got in the way. The problem before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How you imagine it working. It is fine not to know yet.
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
  - type: dropdown
    id: willing
    attributes:
      label: Would you work on it?
      description: Read the intellectual property section of `CONTRIBUTING.md` before saying yes.
      options:
        - "No"
        - "Yes, under the terms in CONTRIBUTING.md"
